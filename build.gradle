buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.marklogic:marklogic-unit-test-client:2.0.0"
    }
}

plugins {
  id "net.saliman.properties" version "1.6.0"
  id "com.marklogic.ml-gradle" version "6.2.0"
}

repositories {
  mavenCentral()
  maven {url = "https://developer.marklogic.com/maven2/"}
}

configurations {
  corb
  mlcp
}

dependencies {
  corb "com.marklogic:marklogic-corb:2.6.0"
  mlcp "com.marklogic:mlcp:12.1.0"
  mlcp files("lib")
  mlBundle "com.marklogic:marklogic-unit-test-modules:2.0.0"
}

ext {
  mlAppConfig {
		customTokens.put("%%ADMIN_USER%%", mlUsername)
  }
  contentXccUrl = "xcc://${mlUsername}:${mlPassword}@${mlHost}:${mlRestPort}"
}

// DLS retention rules are stored as a document in the content database, so they
// are not part of the ml-config that mlDeploy creates. The `set-retention-policy`
// trigger only fires on `database-online-event`, which a plain `mlDeploy` against
// a running server never raises, leaving a freshly deployed database with no rule
// (and so with the content of superseded versions discarded). Run the same module
// at the end of every deployment so the rule is always in place.
task applyRetentionPolicy(type: com.marklogic.gradle.task.ServerEvalTask) {
  description = "Apply the DLS retention policy by running the set-retention-policy module"
  xquery = '''
    xdmp:invoke(
      "/judgments/triggers/set-retention-policy.xqy",
      (),
      <options xmlns="xdmp:eval"><isolation>different-transaction</isolation></options>
    )
  '''
}
mlPostDeploy.dependsOn applyRetentionPolicy
